name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Run public regression tests
        run: python -B -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate Hub tool projection
        run: python -B scripts/workflow.py tools export --entrypoint hub --output "${{ runner.temp }}/archive-tools-hub.json" --json
      - name: Run Ruff
        run: ruff check --no-cache scripts
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
